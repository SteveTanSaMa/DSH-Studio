name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure text gates: no Xcode needed, so they report in seconds.
  docs:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every in-scope declaration carries a doc comment
        run: python3 Scripts/check-doc-comments.py
      # The injected settings bridge is assembled from several Swift string
      # constants at runtime, so a stray backtick or an opened template literal only
      # breaks the concatenation — never any single file. Node is preinstalled on
      # the runner, which is what makes a real parse check possible here.
      - name: The assembled web-bridge script is valid JavaScript
        run: python3 Scripts/check-web-bridge-script.py

  # The settings page is shipped product code that never touches the Swift build,
  # so it needs its own gate: the page's behaviour, its style parity with the
  # first-party rules it mirrors, and the built bundle the app copies into a
  # profile must all match the sources in this commit.
  settings-plugin:
    name: Settings plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Plugins/dsh-studio-settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the plugin's test dependencies
        run: npm ci
      - name: Run the plugin's tests
        run: npm test
      - name: Rebuild the page bundle
        run: npm run build
      - name: The committed bundle matches the sources
        run: git diff --exit-code -- lib/client.js

  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Run the test suite
        run: |
          set -o pipefail
          xcodebuild test \
            -project "DSH Studio.xcodeproj" \
            -scheme "DSH Studio" \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            | tail -30
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/DerivedData/Logs/Test
          if-no-files-found: ignore

  docbuild:
    name: DocC build without warnings
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Build documentation for every module scheme
        run: |
          set -euo pipefail
          status=0
          for scheme in DeepSeekRuntime DeepSeekHarness DeepSeekLogging; do
            log="$RUNNER_TEMP/docbuild-$scheme.log"
            xcodebuild docbuild \
              -project "DSH Studio.xcodeproj" \
              -scheme "$scheme" \
              -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/DocBuild" > "$log" 2>&1 || status=1

            # DocC warns when a symbol link cannot be resolved, which is exactly
            # what this gate is for. The AppIntents notice is toolchain noise and
            # is filtered out so the gate only reports real documentation issues.
            warnings="$(grep "warning:" "$log" \
              | grep -v "Metadata extraction skipped" \
              | grep -v "appintentsmetadataprocessor" \
              | sort -u || true)"
            if [ -n "$warnings" ]; then
              echo "::error::$scheme produced documentation warnings"
              echo "$warnings"
              status=1
            fi
          done
          exit $status
