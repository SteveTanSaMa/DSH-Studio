name: Build Runtime Artifacts

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: "Immutable Runtime version, for example 2026.08.20.1"
        required: true
        type: string
  push:
    tags:
      - "runtime-*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: darwin-arm64
            runner: macos-14
          - architecture: darwin-x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and smoke-test Runtime
        run: |
          runtime_version="${{ inputs.runtime_version }}"
          if [ -z "$runtime_version" ]; then
            runtime_version="${GITHUB_REF_NAME#runtime-}"
          fi
          RUNTIME_VERSION="$runtime_version" \
          ARCHITECTURE="${{ matrix.architecture }}" \
          OUTPUT_DIR="${{ github.workspace }}/RuntimeArtifacts" \
            ./Scripts/build-runtime.sh

      - name: Upload Runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.architecture }}
          path: RuntimeArtifacts/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/runtime-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Runtime artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: RuntimeArtifacts
          merge-multiple: true

      - name: Publish immutable Runtime release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          runtime_version="${RELEASE_TAG#runtime-}"
          ./Scripts/generate-runtime-catalog.sh \
            "$runtime_version" \
            RuntimeArtifacts/runtime-release.json \
            RuntimeArtifacts/artifact-*.json
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Runtime $RELEASE_TAG" \
            --generate-notes
          gh release upload "$RELEASE_TAG" RuntimeArtifacts/* \
            --repo "$GITHUB_REPOSITORY"
