name: Build Runtime Artifacts

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: "Immutable Runtime version, for example 2026.08.20.1"
        required: true
        type: string
      harness_version:
        description: "Exact @deepseek-ai/dsh version to package"
        required: false
        type: string
      pnpm_version:
        description: "Exact pnpm version to package"
        required: false
        type: string
      runtime_data_format_id:
        description: "Harness data format ID, for example sqlite-v2"
        required: false
        type: string
      runtime_data_format_compatible_with:
        description: "Comma-separated compatible prior format IDs"
        required: false
        type: string
      runtime_data_format_migration:
        description: "Explicit migration identifier, or leave blank"
        required: false
        type: string
  push:
    tags:
      - "runtime-*"
      - "!runtime-catalog"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: darwin-arm64
            runner: macos-14
          - architecture: darwin-x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and smoke-test Runtime
        env:
          RUNTIME_DATA_FORMAT_ID: ${{ inputs.runtime_data_format_id || vars.RUNTIME_DATA_FORMAT_ID }}
          RUNTIME_DATA_FORMAT_COMPATIBLE_WITH: ${{ inputs.runtime_data_format_compatible_with || vars.RUNTIME_DATA_FORMAT_COMPATIBLE_WITH }}
          RUNTIME_DATA_FORMAT_MIGRATION: ${{ inputs.runtime_data_format_migration || vars.RUNTIME_DATA_FORMAT_MIGRATION }}
          RUNTIME_HARNESS_VERSION: ${{ inputs.harness_version || vars.RUNTIME_HARNESS_VERSION }}
          RUNTIME_PNPM_VERSION: ${{ inputs.pnpm_version || vars.RUNTIME_PNPM_VERSION }}
        run: |
          if [ -z "${RUNTIME_DATA_FORMAT_ID:-}" ]; then
            echo "RUNTIME_DATA_FORMAT_ID is required; publish a machine-readable data contract" >&2
            exit 1
          fi
          runtime_version="${{ inputs.runtime_version }}"
          if [ -z "$runtime_version" ]; then
            runtime_version="${GITHUB_REF_NAME#runtime-}"
          fi
          RUNTIME_VERSION="$runtime_version" \
          ARCHITECTURE="${{ matrix.architecture }}" \
          HARNESS_VERSION="$RUNTIME_HARNESS_VERSION" \
          PNPM_VERSION="$RUNTIME_PNPM_VERSION" \
          DSH_RUNTIME_DATA_FORMAT_ID="$RUNTIME_DATA_FORMAT_ID" \
          DSH_RUNTIME_DATA_FORMAT_COMPATIBLE_WITH="${RUNTIME_DATA_FORMAT_COMPATIBLE_WITH:-}" \
          DSH_RUNTIME_DATA_FORMAT_MIGRATION="${RUNTIME_DATA_FORMAT_MIGRATION:-}" \
          OUTPUT_DIR="${{ github.workspace }}/RuntimeArtifacts" \
            ./Scripts/build-runtime.sh

      - name: Upload Runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.architecture }}
          path: RuntimeArtifacts/*
          if-no-files-found: error

  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/runtime-'))
      || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Runtime artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: RuntimeArtifacts
          merge-multiple: true

      - name: Publish immutable Runtime release
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_CATALOG_KEY_ID: runtime-catalog-v1
          RUNTIME_CATALOG_PRIVATE_KEY_BASE64: ${{ secrets.RUNTIME_CATALOG_PRIVATE_KEY_BASE64 }}
        run: |
          runtime_version="${{ inputs.runtime_version }}"
          if [ -z "$runtime_version" ]; then
            runtime_version="${GITHUB_REF_NAME#runtime-}"
          fi
          release_tag="runtime-${runtime_version}"
          ./Scripts/generate-runtime-catalog.sh \
            "$runtime_version" \
            RuntimeArtifacts/runtime-release.json \
            RuntimeArtifacts/artifact-*.json
          ./Scripts/sign-runtime-catalog.sh \
            RuntimeArtifacts/runtime-release.json \
            RuntimeArtifacts/runtime-catalog.signed.json
          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Runtime $release_tag" \
            --generate-notes
          gh release upload "$release_tag" RuntimeArtifacts/* \
            --repo "$GITHUB_REPOSITORY"
          if ! gh release view runtime-catalog --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create runtime-catalog \
              --repo "$GITHUB_REPOSITORY" \
              --title "Runtime catalog" \
              --notes "Signed Runtime catalog for DSH Studio automatic discovery."
          fi
          gh release upload runtime-catalog \
            RuntimeArtifacts/runtime-catalog.signed.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
