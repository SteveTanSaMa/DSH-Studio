name: Release

# Produces a distributable DMG and ZIP.
#
# Without secrets the build is ad-hoc signed, which is enough to run locally but
# not to hand to someone else: macOS will warn on first open. Add these repository
# secrets to publish a signed and notarized build:
#
#   MACOS_CERTIFICATE_P12        base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD   password for that .p12
#   MACOS_KEYCHAIN_PASSWORD      any password for the temporary keychain
#   MACOS_DEVELOPER_ID           e.g. "Developer ID Application: Name (TEAMID)"
#   MACOS_NOTARY_APPLE_ID        Apple ID used for notarization
#   MACOS_NOTARY_TEAM_ID         Apple team identifier
#   MACOS_NOTARY_PASSWORD        app-specific password for that Apple ID
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package the app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Import the signing certificate
        if: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Build
        env:
          DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
        run: |
          set -o pipefail
          if [ -n "${DEVELOPER_ID:-}" ]; then
            xcodebuild build \
              -project "DSH Studio.xcodeproj" \
              -scheme "DSH Studio" \
              -configuration Release \
              -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGN_IDENTITY="$DEVELOPER_ID" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
              | tail -20
          else
            # The project ships ad-hoc signing settings, so this path needs no secrets.
            xcodebuild build \
              -project "DSH Studio.xcodeproj" \
              -scheme "DSH Studio" \
              -configuration Release \
              -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              | tail -20
          fi

      - name: Package DMG and ZIP
        id: package
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/DSH Studio.app"
          test -d "$app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          name="DSH-Studio-${version}-${build}"
          mkdir -p "$RUNNER_TEMP/dist"

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/dist/${name}.zip"
          hdiutil create -volname "DSH Studio" -srcfolder "$app" \
            -ov -format UDZO "$RUNNER_TEMP/dist/${name}.dmg"

          {
            echo "app=$app"
            echo "name=$name"
            echo "dist=$RUNNER_TEMP/dist"
          } >> "$GITHUB_OUTPUT"

      - name: Notarize and staple
        if: ${{ secrets.MACOS_NOTARY_APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          for artifact in "$RUNNER_TEMP/dist"/*.dmg "$RUNNER_TEMP/dist"/*.zip; do
            xcrun notarytool submit "$artifact" \
              --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" \
              --password "$NOTARY_PASSWORD" \
              --wait
          done
          xcrun stapler staple "${{ steps.package.outputs.app }}"
          rm -f "$RUNNER_TEMP/dist"/*.dmg "$RUNNER_TEMP/dist"/*.zip
          ditto -c -k --keepParent "${{ steps.package.outputs.app }}" \
            "$RUNNER_TEMP/dist/${{ steps.package.outputs.name }}.zip"
          hdiutil create -volname "DSH Studio" -srcfolder "${{ steps.package.outputs.app }}" \
            -ov -format UDZO "$RUNNER_TEMP/dist/${{ steps.package.outputs.name }}.dmg"

      - name: Verify the package
        run: |
          set -euo pipefail
          app="${{ steps.package.outputs.app }}"
          codesign --verify --deep --strict --verbose=2 "$app" || true
          spctl --assess --type execute --verbose=2 "$app" || true
          shasum -a 256 "$RUNNER_TEMP/dist"/* > "$RUNNER_TEMP/dist/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/dist/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Studio-${{ github.ref_name }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

      - name: Attach the artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" "$RUNNER_TEMP"/dist/* --clobber
